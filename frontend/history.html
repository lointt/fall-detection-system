<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fall Detection — History</title>
  <link rel="stylesheet" href="history.css" />
</head>
<body>
  <div class="app-wrapper">

    <!-- ── HEADER ─────────────────────────── -->
    <header class="header">
      <span class="header-title">Fall Detection System</span>
      <nav class="nav-tabs">
        <a href="index.html"   class="tab">live</a>
        <a href="history.html" class="tab tab--active">history</a>
      </nav>
    </header>

    <!-- ── BODY ──────────────────────────────── -->
    <div class="body-wrap">

      <!-- Left: camera / session list -->
      <aside class="sidebar">
        <div class="camera-card camera-card--active">
          <div class="camera-thumb">
            <span class="camera-thumb__label">living room</span>
          </div>
        </div>
        <div class="session-list" id="sessionList">
          <p class="session-empty">Đang tải…</p>
        </div>
      </aside>

      <!-- Right: player + control bar -->
      <div class="right-col">

        <!-- Video area -->
        <div class="feed-container" id="feedContainer">

          <!-- Meta overlay top-left inside screen -->
          <div class="feed-meta" id="feedMeta" style="display:none">
            <span class="feed-meta__room">living room</span>
            <div class="feed-meta__datetime">
              <span id="histDate">--</span>
              <span id="histTime">-- : -- : --</span>
            </div>
          </div>

          <video id="histVideo" class="feed-video" preload="metadata"></video>

          <div class="feed-placeholder" id="feedPlaceholder">
            <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
              <rect x="2" y="7" width="20" height="15" rx="2"/>
              <path d="m12 3-4 4h8l-4-4z"/>
              <circle cx="12" cy="14.5" r="2.5"/>
            </svg>
            <p>Chọn một phiên ghi hình để xem lại</p>
          </div>

          <div class="fall-badge" id="fallBadge" style="display:none">⚠️ TÉ NGÃ PHÁT HIỆN</div>
        </div>

        <!-- ── CONTROL BAR ─────────────────── -->
        <footer class="control-bar">

          <!-- LEFT group: rotate(UI) + play + divider + date strip + calendar -->
          <div class="ctrl-group">

            <!-- Rotate UI only -->
            <button class="ctrl-btn" disabled title="Chỉ dùng webcam laptop" aria-label="Xoay">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
              </svg>
            </button>

            <!-- Play/Pause -->
            <button class="ctrl-btn" id="btnPlay" aria-label="Phát/Dừng">
              <svg id="iconPlay" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 3 19 12 5 21 5 3"/>
              </svg>
              <svg id="iconPause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none">
                <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
              </svg>
            </button>

            <!-- Blue divider -->
            <div class="ctrl-divider"></div>

            <!-- Date strip (last 10 days) -->
            <div class="date-strip" id="dateStrip"></div>

            <!-- Calendar icon button -->
            <button class="ctrl-btn" id="btnCalendar" title="Chọn ngày" aria-label="Lịch">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
            </button>
            <input type="date" id="datePicker" class="date-hidden" />
          </div>

          <!-- RIGHT group: speed + mute + fullscreen -->
          <div class="ctrl-group">
            <button class="ctrl-btn ctrl-btn--text" id="btnSpeed">x1</button>

            <!-- Mute -->
            <button class="ctrl-btn" id="btnMute" aria-label="Âm thanh">
              <svg id="iconSoundOn" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
              </svg>
              <svg id="iconSoundOff" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <line x1="23" y1="9" x2="17" y2="15"/>
                <line x1="17" y1="9" x2="23" y2="15"/>
              </svg>
            </button>

            <!-- Fullscreen -->
            <button class="ctrl-btn" id="btnFullscreen" aria-label="Toàn màn hình">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 3 21 3 21 9"/>
                <polyline points="9 21 3 21 3 15"/>
                <line x1="21" y1="3" x2="14" y2="10"/>
                <line x1="3" y1="21" x2="10" y2="14"/>
              </svg>
            </button>
          </div>

        </footer>

        <!-- ── BLUE TIMELINE SCRUBBER ──────── -->
        <div class="timeline-wrap" id="timelineWrap">
          <div class="timeline-labels">
            <span id="tlCurrent">00:00</span>
            <span id="tlTotal">00:00</span>
          </div>
          <div class="timeline-track" id="timelineTrack">
            <!-- Blue fill bar -->
            <div class="timeline-bg"></div>
            <div class="timeline-fill" id="timelineFill"></div>
            <!-- Invisible range input for drag -->
            <input type="range" class="timeline-range" id="timelineRange" min="0" value="0" step="0.1" />
          </div>
        </div>

      </div><!-- /right-col -->
    </div><!-- /body-wrap -->

  </div>

  <script src="history.js"></script>
</body>
</html>
